<div class="page-container">
  <!-- Header -->
  <header class="header">
    <nav>
      <h1>Smart iTVent Management App</h1>

    </nav>
  </header>

  <div class="login-container">
    <div class="login-box">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a>
              <img src="../../../../assets/images/logos/matech-logo.svg" height="70" width="200" class="align-middle m-2" alt="logo" />
            </a>
          </div>

          <mat-card-title>Log in</mat-card-title>
          <form class="m-t-30" [formGroup]="loginForm" autocomplete="off" novalidate (ngSubmit)="loginUser(loginForm.value)">
            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
            <mat-form-field appearance="outline" class="w-100 form-field-with-hover" color="accent">
              <input matInput type="text" id="username" formControlName="username" class="form-control" />
            </mat-form-field>

            <mat-label class="mat-subtitle-2 f-s-14 f-w-600 m-b-12 d-block">Password</mat-label>
            <mat-form-field appearance="outline" class="w-100 form-field-with-hover position-relative" color="accent">
              <div class="password-container">
                <input matInput [type]="hidePassword ? 'password' : 'text'" id="password" formControlName="password" class="form-control" />
                <div class="password-toggle-button" (click)="togglePasswordVisibility()">
                  <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
                </div>
              </div>
            </mat-form-field>

            <!-- <div class="d-flex align-items-center m-b-12">
              <a [routerLink]="['/authentication/forgot-password']" class="text-primary f-w-600 text-decoration-none m-l-auto f-s-14">
                Forgot Password?
              </a>
            </div> -->

            <button mat-flat-button color="primary" class="w-100 btn-hover" type="submit" [disabled]="!loginForm.valid">Sign In</button>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>

<footer class="footer">
    <p>🔔 Copyright &copy; 2024 | All Rights Reserved | Developed by ARPAN & SHUBHAM 🔔 </p>
</footer>
